name: Profile

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  profile:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgtx_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5433
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pgtx_test
      PGMAX: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install wrk and psql
        run: sudo apt-get install -y wrk postgresql-client

      - name: Seed database for wrk
        run: |
          psql -h localhost -p 5433 -U postgres -d pgtx_test -c "
            DROP TABLE IF EXISTS bench_users;
            CREATE TABLE bench_users (id SERIAL PRIMARY KEY, name TEXT, balance INT);
            INSERT INTO bench_users (name, balance)
            SELECT 'User ' || i, floor(random() * 1000) FROM generate_series(1, 1000) s(i);
          "

      - name: Write profiling helpers
        run: |
          mkdir -p prof

          # node пишет .cpuprofile только при нормальном выходе, а на SIGTERM по умолчанию
          # умирает молча (и kill -9 тоже теряет профиль). Этот прелоад делает выход чистым.
          cat > prof/preload.mjs <<'EOF'
          const quit = () => process.exit(0)
          process.on('SIGTERM', quit)
          process.on('SIGINT', quit)
          EOF

          # Печатает топ функций по self-time и топ файлов
          cat > prof/top.mjs <<'EOF'
          import { readFileSync } from 'node:fs'

          const file = process.argv[2]
          const p = JSON.parse(readFileSync(file, 'utf8'))
          const byId = new Map(p.nodes.map(n => [n.id, n]))

          const byFn = new Map()
          const byFile = new Map()
          let total = 0

          p.samples.forEach((id, i) => {
            const dt = p.timeDeltas[i] ?? 0
            const cf = byId.get(id).callFrame
            const where = cf.url ? cf.url.replace(/^.*\/(node_modules|src|dist|node:)/, '$1') : '(native)'
            const fn = `${cf.functionName || '(anonymous)'}  ${where}:${cf.lineNumber + 1}`
            byFn.set(fn, (byFn.get(fn) ?? 0) + dt)
            byFile.set(where, (byFile.get(where) ?? 0) + dt)
            total += dt
          })

          const show = (title, map, n) => {
            console.log(`\n--- ${title} ---`)
            for (const [k, v] of [...map].sort((a, b) => b[1] - a[1]).slice(0, n)) {
              console.log(`${(v / 1000).toFixed(0).padStart(7)} ms  ${(v / total * 100).toFixed(1).padStart(5)}%  ${k}`)
            }
          }

          console.log(`\n===== ${file}: ${(total / 1000).toFixed(0)} ms sampled =====`)
          show('top functions by self time', byFn, 30)
          show('top files by self time', byFile, 12)

          const parent = new Map()
          for (const n of p.nodes) for (const c of n.children ?? []) parent.set(c, n.id)
          const chain = id => {
            const out = []
            for (let cur = parent.get(id); cur !== undefined && out.length < 6; cur = parent.get(cur)) {
              const cf = byId.get(cur).callFrame
              if (cf.functionName === '(root)') break
              out.push((cf.functionName || '(anonymous)') + '@' + (cf.url.split('/').pop() || 'native'))
            }
            return out.join(' < ')
          }
          const callers = new Map()
          p.samples.forEach((id, i) => {
            const name = byId.get(id).callFrame.functionName
            if (name === 'writev' || name === '(garbage collector)') {
              const key = `${name}  <  ${chain(id)}`
              callers.set(key, (callers.get(key) ?? 0) + (p.timeDeltas[i] ?? 0))
            }
          })
          show('who calls writev / GC', callers, 10)
          EOF

      - name: Profile servers under wrk
        run: |
          profile() {
            local name=$1 conns=$2 path=$3 server=${4:-server-pgtx.ts} port=${5:-3000}

            echo "=========================================="
            echo "  PROFILE: $name ($conns conns, $path)"
            echo "=========================================="

            node --cpu-prof --cpu-prof-dir=prof --cpu-prof-name="$name.cpuprofile" \
                 --import ./prof/preload.mjs --import tsx "$server" \
                 > "prof/server-$name.log" 2>&1 &
            local pid=$!
            sleep 3

            # короткий прогрев, чтобы холодный старт не забил профиль
            timeout 20 wrk -t2 -c50 -d3s http://localhost:$port$path > /dev/null || true

            timeout 40 wrk -t2 -c$conns -d10s --latency http://localhost:$port$path
            echo "wrk exit code: $?"

            # жив ли сервер и отвечает ли после нагрузки (диагностика пустого вывода на 200 conns)
            if kill -0 $pid 2>/dev/null; then echo "server process: alive"; else echo "server process: DEAD"; fi
            curl -s -m 5 -o /dev/null -w "post-wrk request: HTTP %{http_code} in %{time_total}s\n" \
              http://localhost:$port$path || echo "post-wrk request: no response (hang?)"

            kill -TERM $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true

            echo "--- server log ---"
            tail -n 40 "prof/server-$name.log"

            node prof/top.mjs "prof/$name.cpuprofile" || echo "no profile written for $name"
            sleep 3
          }

          profile pgtx-c10000-users 10000 /users server-pgtx.ts       3000
          profile pgjs-c10000-users 10000 /users server-postgresjs.ts 3001
          profile pgtx-c200-users   200   /users server-pgtx.ts       3000
          profile pgtx-c10000-user  10000 /user  server-pgtx.ts       3000

      - name: Upload cpuprofiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpuprofiles
          path: prof/*.cpuprofile
