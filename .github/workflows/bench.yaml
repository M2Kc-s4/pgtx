name: Database Drivers Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Install wrk and psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client wrk

      - name: Create benchmark table
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d test -c "
            DROP TABLE IF EXISTS users;
            CREATE TABLE users (id SERIAL PRIMARY KEY, name TEXT, balance INT);
            INSERT INTO users (name, balance)
            SELECT 'User ' || i, floor(random() * 1000) FROM generate_series(1, 1000) s(i);
          "

      - name: Start server
        run: |
          bun test-server.ts &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is up!"
              exit 0
            fi
            sleep 1
          done

          echo "Server did not start within 30s"
          exit 1
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: test

      - name: Warm up
        run: |
          curl -s http://localhost:3000/pgtx > /dev/null
          curl -s http://localhost:3000/postgresjs > /dev/null
          curl -s http://localhost:3000/bunsql > /dev/null
          sleep 2

      - name: Benchmark - 50 connections
        run: |
          mkdir -p results
          echo "=== Benchmark with 50 connections ===" | tee results/benchmark_50.txt

          echo -e "\n--- PGTX Driver ---" | tee -a results/benchmark_50.txt
          wrk -t2 -c50 -d10s --latency http://localhost:3000/pgtx | tee -a results/benchmark_50.txt

          echo -e "\n--- Postgres.js Driver ---" | tee -a results/benchmark_50.txt
          wrk -t2 -c50 -d10s --latency http://localhost:3000/postgresjs | tee -a results/benchmark_50.txt

          echo -e "\n--- Bun.Sql Driver ---" | tee -a results/benchmark_50.txt
          wrk -t2 -c50 -d10s --latency http://localhost:3000/bunsql | tee -a results/benchmark_50.txt

      - name: Benchmark - 200 connections
        run: |
          echo "=== Benchmark with 200 connections ===" | tee results/benchmark_200.txt

          echo -e "\n--- PGTX Driver ---" | tee -a results/benchmark_200.txt
          wrk -t4 -c200 -d10s --latency http://localhost:3000/pgtx | tee -a results/benchmark_200.txt

          echo -e "\n--- Postgres.js Driver ---" | tee -a results/benchmark_200.txt
          wrk -t4 -c200 -d10s --latency http://localhost:3000/postgresjs | tee -a results/benchmark_200.txt

          echo -e "\n--- Bun.Sql Driver ---" | tee -a results/benchmark_200.txt
          wrk -t4 -c200 -d10s --latency http://localhost:3000/bunsql | tee -a results/benchmark_200.txt

      - name: Benchmark - 500 connections
        run: |
          echo "=== Benchmark with 500 connections ===" | tee results/benchmark_500.txt

          echo -e "\n--- PGTX Driver ---" | tee -a results/benchmark_500.txt
          wrk -t8 -c500 -d10s --latency http://localhost:3000/pgtx | tee -a results/benchmark_500.txt

          echo -e "\n--- Postgres.js Driver ---" | tee -a results/benchmark_500.txt
          wrk -t8 -c500 -d10s --latency http://localhost:3000/postgresjs | tee -a results/benchmark_500.txt

          echo -e "\n--- Bun.Sql Driver ---" | tee -a results/benchmark_500.txt
          wrk -t8 -c500 -d10s --latency http://localhost:3000/bunsql | tee -a results/benchmark_500.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
          retention-days: 30

      - name: Stop server
        if: always()
        run: |
          kill $SERVER_PID 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          for n in 50 200 500; do
            f="results/benchmark_$n.txt"
            [ -f "$f" ] || continue
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### $n Connections" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done