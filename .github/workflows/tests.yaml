name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.35

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PGMAX: 10

  benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Install wrk and psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk postgresql-client

      - name: Seed database for wrk
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "
            DROP TABLE IF EXISTS bench_users;
            CREATE TABLE bench_users (id SERIAL PRIMARY KEY, name TEXT, balance INT);
            INSERT INTO bench_users (name, balance)
            SELECT 'User ' || i, floor(random() * 1000) FROM generate_series(1, 1000) s(i);
          "

      - name: Run wrk HTTP benchmark
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PGMAX: 10
        run: |
          bun server-postgresjs.ts &
          POSTGRES_PID=$!

          bun server-pgtx.ts &
          PGTX_PID=$!

          trap 'kill $POSTGRES_PID $PGTX_PID 2>/dev/null || true' EXIT

          for port in 3000 3001; do
            timeout 30 bash -c "until curl -sf http://localhost:$port/simple > /dev/null; do sleep 0.5; done"
          done

          run_pair() {
            local n=$1 label=$2 path=$3 conns=$4

            echo "=========================================="
            echo "  TEST PAIR $n: $label ($conns conns)"
            echo "=========================================="

            echo "$label Postgres.js ($conns conns)"
            wrk -t2 -c$conns -d10s --latency http://localhost:3001/$path

            echo ""
            echo "------------------------------------------"
            echo ""
            sleep 5

            echo "$label @m2k-5f/pgtx ($conns conns)"
            wrk -t2 -c$conns -d10s --latency http://localhost:3000/$path
            sleep 5
          }

          n=1
          for target in "Selecting 5 users|users" "Selecting 1 user|user" "Selecting 1 as res|simple"; do
            label="${target%%|*}"
            path="${target##*|}"
            for conns in 10000 1000 200 50; do
              run_pair $n "$label" "$path" $conns
              n=$((n + 1))
            done
          done